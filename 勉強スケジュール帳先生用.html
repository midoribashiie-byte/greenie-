<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>勉強スケジュール帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
/* Layout: one column. Student screen = header, day tabs, now card, time-scaled timeline per コマ (1分 = 同じ高さ), week summary. Teacher tabs add progress, weekly records with evaluation, and a schedule editor. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface2: #E6EBF1;
  --fg: #16202B;
  --muted: #566371;
  --line: #D6DDE5;
  --accent: #16202B;
  --on-accent: #FFFFFF;
  --now: #A44A07;
  --now-bg: #FFF1DC;
  --danger: #B42318;
  --math: #1D4ED8; --math-bg: #DBEAFE; --math-ink: #1E3A8A;
  --sci: #15803D;  --sci-bg: #DCFCE7;  --sci-ink: #14532D;
  --jpn: #B91C1C;  --jpn-bg: #FEE2E2;  --jpn-ink: #7F1D1D;
  --calc: #7E22CE; --calc-bg: #F3E8FF; --calc-ink: #581C87;
  --soc: #0F766E;  --soc-bg: #CCFBF1;  --soc-ink: #134E4A;
  --eng: #A16207;  --eng-bg: #FEF3C7;  --eng-ink: #713F12;
  --mth: #BE185D;  --mth-bg: #FCE7F3;  --mth-ink: #831843;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --surface: #161D25; --surface2: #222C37; --fg: #E7ECF1; --muted: #9BA8B5; --line: #2B3642;
    --accent: #E7ECF1; --on-accent: #0E1318; --now: #F5B14C; --now-bg: #2B2012; --danger: #FF8A80;
    --math: #3461D6; --math-bg: #1A2745; --math-ink: #BFD2FF;
    --sci: #1B7F43;  --sci-bg: #143222;  --sci-ink: #B4EBC8;
    --jpn: #C73535;  --jpn-bg: #3A1A1C;  --jpn-ink: #FFC2C2;
    --calc: #8B3FD9; --calc-bg: #2D1B45; --calc-ink: #E2C8FF;
    --soc: #12857B;  --soc-bg: #0F2E2B;  --soc-ink: #A7F0E6;
    --eng: #A8650B;  --eng-bg: #33260A;  --eng-ink: #FDE68A;
    --mth: #C03A7B;  --mth-bg: #3A1A2B;  --mth-ink: #FBCFE8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #161D25; --surface2: #222C37; --fg: #E7ECF1; --muted: #9BA8B5; --line: #2B3642;
  --accent: #E7ECF1; --on-accent: #0E1318; --now: #F5B14C; --now-bg: #2B2012; --danger: #FF8A80;
  --math: #3461D6; --math-bg: #1A2745; --math-ink: #BFD2FF;
  --sci: #1B7F43;  --sci-bg: #143222;  --sci-ink: #B4EBC8;
  --jpn: #C73535;  --jpn-bg: #3A1A1C;  --jpn-ink: #FFC2C2;
  --calc: #8B3FD9; --calc-bg: #2D1B45; --calc-ink: #E2C8FF;
  --soc: #12857B;  --soc-bg: #0F2E2B;  --soc-ink: #A7F0E6;
  --eng: #A8650B;  --eng-bg: #33260A;  --eng-ink: #FDE68A;
  --mth: #C03A7B;  --mth-bg: #3A1A2B;  --mth-ink: #FBCFE8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums;
}
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.loading, .empty { margin: 0; padding: 28px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }

.s-math { --c: var(--math); --cbg: var(--math-bg); --ci: var(--math-ink); }
.s-sci  { --c: var(--sci);  --cbg: var(--sci-bg);  --ci: var(--sci-ink); }
.s-jpn  { --c: var(--jpn);  --cbg: var(--jpn-bg);  --ci: var(--jpn-ink); }
.s-calc { --c: var(--calc); --cbg: var(--calc-bg); --ci: var(--calc-ink); }
.s-soc  { --c: var(--soc);  --cbg: var(--soc-bg);  --ci: var(--soc-ink); }
.s-eng  { --c: var(--eng);  --cbg: var(--eng-bg);  --ci: var(--eng-ink); }
.s-mth  { --c: var(--mth);  --cbg: var(--mth-bg);  --ci: var(--mth-ink); }

/* teacher tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface2); border-radius: 14px; }
.tabs button { border: 0; background: transparent; border-radius: 10px; min-height: 44px; padding: 4px 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.head > div { min-width: 0; }
.eyebrow { margin: 0; font-size: 14px; color: var(--muted); letter-spacing: .06em; }
h1 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.25; text-wrap: balance; }
.ring { position: relative; width: 68px; height: 68px; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface2); }
.ring .val { stroke: var(--accent); transition: stroke-dasharray .4s ease; }
.ring .cnt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.1; }
.ring .cnt small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }

/* day tabs */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px 7px; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.day .dw { font-size: 13px; font-weight: 700; }
.day .dn { font-size: 12px; color: var(--muted); }
.day .df { font-size: 11px; font-weight: 700; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .df { color: var(--on-accent); opacity: .8; }
.day.full .df { text-decoration: underline; text-underline-offset: 2px; }
.day .tdy { font-size: 10px; font-weight: 700; color: var(--now); line-height: 1.2; }
.day[aria-pressed="true"] .tdy { color: var(--on-accent); }

/* teacher message card */
.voice { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.voice .gr { grid-row: 1 / span 2; font-family: var(--font-display); font-size: 34px; line-height: 1; }
.voice b { font-size: 13px; color: var(--muted); font-weight: 500; }
.voice p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* now card */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--now-bg); color: var(--now); border: 1px solid var(--now); }
.badge.plain { background: var(--surface2); color: var(--muted); border-color: var(--line); }
.chip { font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 999px; background: var(--c); color: #fff; }
.hero h2 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.hero .range { margin: 0; color: var(--muted); font-size: 14px; }
.remain { display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
.remain strong { font-family: var(--font-display); font-size: 40px; line-height: 1; }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; transition: width .4s ease; }
.hero .note { margin: 0; font-size: 14px; color: var(--muted); }
.hero.plain h2 { font-size: 22px; }

/* timeline: height is proportional to minutes */
.komas { display: flex; flex-direction: column; gap: 22px; }
.koma h3 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-size: 17px; }
.koma h3 span { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.tl { position: relative; display: grid; grid-template-rows: repeat(var(--rows, 6), var(--slot)); }
.slot.hr { border-top-style: solid; }
.slot.hr .lab { font-weight: 700; color: var(--fg); }
.slot.q { border-top-style: dotted; }
.slot { display: flex; align-items: flex-start; width: 100%; margin: 0; padding: 0; border: 0; border-top: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 12px; text-align: left; }
.slot .lab { width: 52px; flex: none; padding-top: 2px; }
button.slot:hover { background: var(--surface2); }
button.slot:hover::after { content: "＋ ここに追加"; padding: 2px 0 0 8px; color: var(--fg); }
.tl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.blocks { position: absolute; left: 52px; right: 0; top: 0; bottom: 0; pointer-events: none; }
.task { position: absolute; left: 0; right: 0; pointer-events: auto; display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 6px; margin: 0; padding: 2px 4px 2px 12px; border: 0; border-radius: 10px; background: var(--cbg); color: var(--ci); overflow: hidden; text-align: left; }
.task.edit { grid-template-columns: minmax(0, 1fr); }
.task.tall { align-items: start; padding-top: 8px; }
.task .tx { min-width: 0; display: flex; flex-direction: column; }
.task .l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.task .subj { font-weight: 700; font-size: 15px; flex: none; }
.task .lb { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.task .mins { font-size: 12px; opacity: .85; flex: none; }
.task .l2 { font-size: 12px; opacity: .85; }
.task .tag { flex: none; font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
.task.lesson { background: var(--c); color: #fff; }
.task.now { outline: 3px solid var(--now); outline-offset: 1px; z-index: 2; }
.task.sel { outline: 3px solid var(--fg); outline-offset: 1px; z-index: 2; }
.task.done .tx { opacity: .55; }
.task.done .subj, .task.done .lb { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 2px solid currentColor; background: transparent; display: grid; place-items: center; padding: 0; }
.chk svg { width: 22px; height: 22px; opacity: 0; }
.chk:disabled { cursor: default; opacity: .6; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.task.lesson .chk { color: #fff; }
.task.lesson .chk[aria-pressed="true"] { background: #fff; border-color: #fff; color: var(--c); }
.nowline { position: absolute; left: 44px; right: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -2px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.panel h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; }
.subs { display: flex; flex-direction: column; gap: 12px; }
.sub { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 14px; }
.sub b { font-weight: 700; }
.sub .bar { height: 12px; }
.sub span { color: var(--muted); font-size: 13px; text-align: right; min-width: 110px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big strong { font-family: var(--font-display); font-size: 44px; line-height: 1; }
.big span { color: var(--muted); font-size: 14px; }
.dgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dcell { border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.dcell b { font-size: 13px; }
.dcell .bar { height: 6px; }
.todo { display: flex; flex-direction: column; gap: 10px; }
.todo h3 { color: var(--fg); font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.todo ul, .dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.li { display: grid; grid-template-columns: 84px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.li .t { color: var(--muted); font-size: 13px; }
.li .chip { font-size: 12px; padding: 0 10px; }
.li .ok { font-weight: 700; }
.li .no { color: var(--muted); }
.mini { font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
.late { color: var(--danger); }

/* records */
.banner { border: 1px solid var(--now); background: var(--now-bg); color: var(--now); border-radius: 14px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; font-size: 14px; }
.banner button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; min-height: 40px; padding: 4px 16px; font-weight: 700; }
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.wk > button { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 14px 16px; min-height: 64px; }
.wk .r1 { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wk .r2 { font-size: 13px; color: var(--muted); }
.wk .gr { font-family: var(--font-display); font-size: 26px; min-width: 30px; text-align: center; }
.wk .body { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cbtn { min-height: 44px; padding: 4px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.cbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.cbtn:disabled { opacity: .4; cursor: not-allowed; }
.cbtn.s { border-color: var(--c); color: var(--ci); background: var(--cbg); }
.cbtn.s[aria-pressed="true"] { background: var(--c); color: #fff; border-color: var(--c); }
textarea, input[type="text"], select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { resize: vertical; min-height: 88px; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; min-height: 72px; word-break: break-all; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, fieldset legend { font-size: 13px; color: var(--muted); font-weight: 500; padding: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 6px 20px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.dng { color: var(--danger); border-color: var(--danger); }
.btn.dng.arm { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { margin: 0; font-size: 14px; }
.msg.err { color: var(--danger); font-weight: 700; }
.msg.ok { color: var(--muted); }

@media (max-width: 420px) {
  h1 { font-size: 26px; }
  .sub { grid-template-columns: 40px minmax(0, 1fr); }
  .sub span { grid-column: 1 / -1; text-align: left; margin-top: -6px; }
  .li { grid-template-columns: 1fr auto; }
  .li .t { grid-column: 1 / -1; }
  .row2 { grid-template-columns: 1fr; }
  .tabs button { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .ring .val, .bar i { transition: none; }
}

.sbar { display: flex; flex-direction: column; gap: 6px; }
.stu .r2 b { color: var(--fg); }
.badge.warn { background: var(--now-bg); color: var(--now); border-color: var(--now); }
.hint.tm { font-size: 12px; color: var(--muted); }
.donelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.dl { display: grid; grid-template-columns: 112px auto minmax(0, 1fr); gap: 8px; align-items: center; font-size: 14px; }
.dl time { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) { .dl { grid-template-columns: 1fr; gap: 0; } }

.app.wide { max-width: 1180px; }
.vsw { display: flex; gap: 8px; flex-wrap: wrap; }
.gwrap { overflow-x: auto; padding-bottom: 4px; }
.ggrid { --rh: 44px; display: grid; min-width: 960px; gap: 3px; grid-template-columns: 84px 48px repeat(7, minmax(0, 1fr));
  grid-template-rows: 44px repeat(6, minmax(var(--rh), auto)) 10px repeat(6, minmax(var(--rh), auto)) 10px repeat(6, minmax(var(--rh), auto)); }
.gh { background: var(--accent); color: var(--on-accent); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; line-height: 1.2; }
.gh small { font-size: 11px; font-weight: 400; opacity: .85; }
.gcorner { grid-column: 1 / span 2; grid-row: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.gk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.gk b { font-size: 16px; }
.gk span { font-size: 12px; line-height: 1.4; text-align: center; color: var(--muted); }
.gt { display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 11px; color: var(--muted); }
div.gc, button.gc { font: inherit; text-align: left; margin: 0; cursor: pointer; box-sizing: border-box; min-width: 0; padding: 3px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: var(--cbg); color: var(--ci); display: flex; flex-direction: column; justify-content: center; gap: 1px; overflow: hidden; }
div.gc.lesson, button.gc.lesson { background: var(--c); border-color: var(--c); color: #fff; }
div.gc.sel, button.gc.sel { outline: 3px solid var(--fg); outline-offset: 1px; }
.gc .g1 { font-size: 13px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.gc.lg .g1 { font-size: 16px; }
.gc .g2 { font-size: 11px; line-height: 1.3; opacity: .9; }
.gc.one { flex-direction: row; align-items: center; gap: 6px; }
.gc.one .g1 { flex: 1; min-width: 0; font-size: 12px; }
.gc.one .g2 { flex: none; white-space: nowrap; }
.gadd { box-sizing: border-box; min-width: 0; border: 1px dashed var(--line); border-radius: 8px; background: transparent; color: var(--muted); font-size: 16px; padding: 0; }
.gadd:hover, .gadd:focus-visible { background: var(--surface2); }
.gadd.wide { min-height: 44px; font-size: 13px; }
